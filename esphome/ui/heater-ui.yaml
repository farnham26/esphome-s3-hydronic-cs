# Heater UI (LVGL, 320x240): fonts, styles and pages, shared by the device
# (hydronic-s3.yaml) and the SDL preview (hydronic-s3-sdl.yaml). The including
# config sets lvgl displays/buffer and the values.
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 22
  - file: "gfonts://Roboto"
    id: font_body
    size: 18
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Δ", "·"]
  - file: "gfonts://Roboto"
    id: font_big
    size: 48
    glyphs: "0123456789.-°C "
  - file: "gfonts://Roboto"
    id: font_mid
    size: 30
    glyphs: "0123456789.-°C "
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "·"]
  - file: "gfonts://Roboto Mono"
    id: font_mono
    size: 14

lvgl:
  style_definitions:
    - id: style_dim
      text_color: 0xA0A0A0
      text_font: font_body
    - id: style_caption
      text_color: 0x909090
      text_font: font_small
    - id: style_chip
      height: 26
      radius: 6
      border_width: 0
      pad_all: 0
      bg_color: 0x303030
      scrollbar_mode: "OFF"
  theme:
    label:
      text_color: 0xFFFFFF
      text_font: font_body
  pages:
    - id: page_heater
      bg_color: 0x000000
      widgets:
        - obj:
            x: 0
            y: 0
            width: 320
            height: 30
            bg_color: 0x421A00
            border_width: 0
            radius: 0
            widgets:
              - label:
                  align: LEFT_MID
                  text: "Hydronic S3"
                  text_font: font_title
                  text_color: 0xFF9030
              - label:
                  id: lbl_can
                  align: RIGHT_MID
                  text: "CAN --"
                  text_color: 0xFF4040
        - label:
            x: 10
            y: 34
            styles: style_caption
            text: "OUTLET"
        - label:
            id: lbl_outlet
            x: 8
            y: 48
            text_font: font_big
            text: "--.- °C"
        - label:
            x: 200
            y: 34
            styles: style_caption
            text: "INLET"
        - label:
            id: lbl_inlet
            x: 200
            y: 50
            text_font: font_mid
            text: "--.- °C"
        - label:
            id: lbl_dt
            x: 200
            y: 84
            styles: style_dim
            text: "ΔT -- K"
        - bar:
            id: bar_power
            x: 10
            y: 112
            width: 300
            height: 24
            min_value: 0
            max_value: 5600
            value: 0
            bg_color: 0x2A2A2A
            bg_opa: COVER
            radius: 5
            indicator:
              bg_color: 0xE06000
              radius: 5
        - label:
            id: lbl_power
            x: 10
            y: 114
            width: 300
            text_align: CENTER
            text: "-- W"
        - obj:
            id: chip_phase
            x: 10
            y: 144
            width: 96
            styles: style_chip
            widgets:
              - label:
                  id: lbl_phase
                  align: CENTER
                  text: "--"
        - obj:
            id: chip_flame
            x: 112
            y: 144
            width: 92
            styles: style_chip
            widgets:
              - label:
                  id: lbl_flame
                  align: CENTER
                  text: "FLAME"
        - obj:
            id: chip_glow
            x: 210
            y: 144
            width: 100
            styles: style_chip
            widgets:
              - label:
                  id: lbl_glow
                  align: CENTER
                  text: "GLOW"
        - label:
            id: lbl_blower
            x: 10
            y: 178
            text: "Blower -- rpm"
        - label:
            id: lbl_voltage
            align: TOP_RIGHT
            x: -10
            y: 178
            text: "-- V"
        - label:
            id: lbl_heater
            x: 10
            y: 200
            styles: style_dim
            text: ""
        - label:
            id: lbl_refs
            x: 10
            y: 222
            styles: style_caption
            text: ""
    - id: page_bus
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_bus
            x: 6
            y: 4
            text: ""
        - label:
            id: lbl_ids
            x: 2
            y: 30
            text_font: font_mono
            text: ""

