# Minimal integration example: hydronic_s3 on the ESP32's own CAN controller (TWAI)
# with an external transceiver, replacing the EasyStart. Pins are placeholders; add
# wifi/api/ota as usual. Compile check: ../work/venv/bin/esphome compile example-twai.yaml
esphome:
  name: hydronic-s3-twai

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      # TWAI ISR in IRAM, runs while the flash cache is off (OTA, NVS writes): no RX loss there.
      CONFIG_TWAI_ISR_IN_IRAM: y
      CONFIG_TWAI_ISR_CACHE_SAFE: y

external_components:
  - source:
      type: local
      path: ../components
    components: [hydronic_s3]

logger:
  level: DEBUG
  initial_level: INFO

canbus:
  - platform: esp32_can
    id: heater_can
    tx_pin: GPIO4
    rx_pin: GPIO5
    can_id: 0x7A0          # unused (the component sends with explicit IDs)
    bit_rate: 500KBPS

# No listen-only hook: without an EasyStart the controller must ack anyway.
hydronic_s3:
  id: heater
  canbus_id: heater_can
  # The regulator pattern from the README ("Stopping from a regulator").
  on_run_ended:  # burn ended at the coolant limit (run still on), or the heater ended the run
    - logger.log: {format: "run ended: %s", args: [reason.c_str()]}
    - script.execute: heater_regulate
  on_new_fault_code:
    - logger.log: {format: "new heater fault code %s", args: [code.c_str()], level: WARN}

# Regulator output -> burner, without wasted cycles: off only while the burner is out (end of a
# burn, or not started). A stop during a start is deferred by the component. Fan /
# Residual heat: no burner, stops at once.
script:
  - id: heater_regulate
    then:
      - if:
          condition:
            switch.is_on: heat_demand
          then:
            - hydronic_s3.command: {id: heater, run: true}
          else:
            - if:  # burner out: free stop, no restart at ~70 °C
                condition:
                  and:
                    - hydronic_s3.commanding: heater
                    - not:
                        hydronic_s3.burner_on: heater
                then:
                  - hydronic_s3.command: {id: heater, run: false}

# esp32_can has no bus-off recovery: restart the controller after a bus-off.
interval:
  - interval: 1s
    then:
      - lambda: |-
          twai_status_info_t st;
          if (twai_get_status_info(&st) != ESP_OK) return;
          if (st.state == TWAI_STATE_BUS_OFF) {
            ESP_LOGW("twai", "bus-off (TEC %u), recovering", (unsigned) st.tx_error_counter);
            twai_initiate_recovery();
          } else if (st.state == TWAI_STATE_STOPPED) {
            twai_start();
          }
          // No node acks (heater asleep/unpowered): TWAI retransmits the frame forever at
          // 100 % bus load (error-passive, no bus-off). After 2 s, drop it (stop clears TX).
          static uint8_t unacked = 0;
          unacked = (st.state == TWAI_STATE_RUNNING && st.tx_error_counter >= 128 && st.msgs_to_tx > 0) ? unacked + 1 : 0;
          if (unacked >= 2) {
            ESP_LOGW("twai", "no ack for 2 s, dropping pending TX");
            twai_stop();
            twai_start();
            unacked = 0;
          }

switch:
  - platform: hydronic_s3
    type: run
    id: heater_command
    name: "Heater Run"
  - platform: template
    id: heat_demand  # set by your regulator
    name: "Heat Demand"
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: heater_regulate
    on_turn_off:
      - script.execute: heater_regulate

select:
  - platform: hydronic_s3
    mode:
      id: heater_mode
      name: "Heater Mode"

number:
  - platform: hydronic_s3
    run_watchdog:
      name: "Heater Run Watchdog"

button:
  - platform: hydronic_s3
    read_fault_codes:
      name: "Read Fault Codes"

sensor:
  - platform: hydronic_s3
    outlet_temperature:
      name: "Outlet Temperature"
    inlet_temperature:
      name: "Inlet Temperature"
    heating_power:
      name: "Heating Power (estimated)"
    fuel_consumption:
      name: "Fuel Consumption"
    water_flow:
      name: "Water Flow (estimated)"
    supply_voltage:
      name: "Supply Voltage"
    operating_phase:
      name: "Operating Phase"

binary_sensor:
  - platform: hydronic_s3
    flame:
      name: "Flame"
    connected:
      name: "Heater Connected"

text_sensor:
  - platform: hydronic_s3
    state:
      name: "Heater State"
    operating_phase_text:
      name: "Operating Phase Text"
    fault_codes:
      name: "Heater Fault Codes"
