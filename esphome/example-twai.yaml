# Minimal integration example: hydronic_s3 on the ESP32's own CAN controller (TWAI)
# with an external transceiver, replacing the EasyStart. Pins are placeholders; add
# wifi/api/ota as usual. Compile check: ../work/venv/bin/esphome compile example-twai.yaml
esphome:
  name: hydronic-s3-twai
  on_boot:
    - priority: -100
      then:
        # Restored values do not run set_action: apply mode and watchdog once.
        - lambda: |-
            using hydronic_s3::HydronicS3;
            const std::string m = id(heater_mode).current_option();
            id(heater).set_command_mode(m == "Residual heat" ? HydronicS3::MODE_RESIDUAL
                                        : m == "Fan"         ? HydronicS3::MODE_FAN
                                                             : HydronicS3::MODE_HEAT);
            if (!std::isnan(id(heater_watchdog).state))
              id(heater).set_command_lease(id(heater_watchdog).state * 60000);

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      # TWAI ISR in IRAM, runs while the flash cache is off (OTA, NVS writes): no RX loss there.
      CONFIG_TWAI_ISR_IN_IRAM: y
      CONFIG_TWAI_ISR_CACHE_SAFE: y

external_components:
  - source:
      type: local
      path: ../components
    components: [hydronic_s3]

logger:
  level: DEBUG
  initial_level: INFO

canbus:
  - platform: esp32_can
    id: heater_can
    tx_pin: GPIO4
    rx_pin: GPIO5
    can_id: 0x7A0          # unused (the component sends with explicit IDs)
    bit_rate: 500KBPS

# No listen-only hook: without an EasyStart the controller must ack anyway.
hydronic_s3:
  id: heater
  canbus_id: heater_can
  # Heater transitions: what, from, to. Named: burner_starting, flame_stable, control_pause,
  # idle (FD10 phase, lags by up to one poll), residual_end (2C4, 100 ms). Here: the regulator
  # pattern from the README ("Stopping from a regulator").
  on_event:
    - lambda: |-
        if (what == "burner_starting") id(burning) = true;
        else if (what == "control_pause") id(burning) = false;
        else if (what == "idle" || (what == "connected" && to == 0)) id(burning) = id(wait_idle) = false;
        else return;
        id(heater_regulate).execute();

# Regulator output -> burner, without wasted cycles: off only while the burner is out (control
# pause, or not started), never during a start; on again only after the run-down (idle). Heat mode
# only: Fan / Residual heat have no burner phases, so a stop would wait for a pause that never comes.
globals:
  - id: heat_demand  # set by your regulator (here: the "Heat Demand" switch)
    type: bool
  - id: burning  # from our start request until control pause / idle
    type: bool
  - id: wait_idle  # stopped, run-down not finished
    type: bool

script:
  - id: heater_regulate
    then:
      - lambda: |-
          auto *h = id(heater);
          if (id(heat_demand)) {
            if (!h->command_on() && !id(wait_idle)) {
              h->set_command(true);
              id(burning) = true;  // the phase (burner_starting) follows only with the next poll
            }
          } else if (h->command_on() && !id(burning)) {
            h->set_command(false);  // burner out: free stop, no restart at ~70 °C
            id(wait_idle) = true;
          }

# esp32_can has no bus-off recovery: restart the controller after a bus-off.
interval:
  - interval: 1s
    then:
      - lambda: |-
          twai_status_info_t st;
          if (twai_get_status_info(&st) != ESP_OK) return;
          if (st.state == TWAI_STATE_BUS_OFF) {
            ESP_LOGW("twai", "bus-off (TEC %u), recovering", (unsigned) st.tx_error_counter);
            twai_initiate_recovery();
          } else if (st.state == TWAI_STATE_STOPPED) {
            twai_start();
          }
          // No node acks (heater asleep/unpowered): TWAI retransmits the frame forever at
          // 100 % bus load (error-passive, no bus-off). After 2 s, drop it (stop clears TX).
          static uint8_t unacked = 0;
          unacked = (st.state == TWAI_STATE_RUNNING && st.tx_error_counter >= 128 && st.msgs_to_tx > 0) ? unacked + 1 : 0;
          if (unacked >= 2) {
            ESP_LOGW("twai", "no ack for 2 s, dropping pending TX");
            twai_stop();
            twai_start();
            unacked = 0;
          }

switch:
  - platform: template
    id: heater_command
    name: "Heater Run"
    lambda: "return id(heater).command_on();"
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - hydronic_s3.command: {id: heater, run: true}
    turn_off_action:
      - hydronic_s3.command: {id: heater, run: false}
  - platform: template
    id: heat_demand_switch
    name: "Heat Demand"
    lambda: "return id(heat_demand);"
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: "id(heat_demand) = true;"
      - script.execute: heater_regulate
    turn_off_action:
      - lambda: "id(heat_demand) = false;"
      - script.execute: heater_regulate
  # Polling of the live values; it stops by itself while the heater sleeps.
  - platform: template
    id: poll_dids
    restore_mode: ALWAYS_ON
    optimistic: true
    internal: true
    turn_on_action:
      - lambda: "id(heater).start_polling(esphome::hydronic_s3::HydronicS3::sensor_dids(), 5000);"
    turn_off_action:
      - lambda: "id(heater).stop_polling();"

select:
  - platform: template
    id: heater_mode
    name: "Heater Mode"
    options: ["Heat", "Residual heat", "Fan"]
    initial_option: "Heat"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          using hydronic_s3::HydronicS3;
          id(heater).set_command_mode(x == "Residual heat" ? HydronicS3::MODE_RESIDUAL
                                      : x == "Fan"         ? HydronicS3::MODE_FAN
                                                           : HydronicS3::MODE_HEAT);

number:
  - platform: template
    id: heater_watchdog
    name: "Heater Run Watchdog"
    unit_of_measurement: min
    min_value: 0
    max_value: 600
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: "id(heater).set_command_lease(x * 60000);"

sensor:
  - platform: hydronic_s3
    outlet_temperature:
      name: "Outlet Temperature"
    inlet_temperature:
      name: "Inlet Temperature"
    heating_power:
      name: "Heating Power (estimated)"
    fuel_consumption:
      name: "Fuel Consumption"
    water_flow:
      name: "Water Flow (estimated)"
    supply_voltage:
      name: "Supply Voltage"
    operating_phase:
      name: "Operating Phase"

binary_sensor:
  - platform: hydronic_s3
    flame:
      name: "Flame"
    connected:
      name: "Heater Connected"

text_sensor:
  - platform: hydronic_s3
    state:
      name: "Heater State"
    operating_phase_text:
      name: "Operating Phase Text"
    fault_codes:
      name: "Heater Fault Codes"
