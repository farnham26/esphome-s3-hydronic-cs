# Eberspächer Hydronic S3 on CAN: hydronic_s3 component, heater data on the
# display and as HA sensors. Listen-only until the protocol is decoded; the
# component logs new IDs, changing bytes and a periodic ID table.
# Hardware: M5Stack Fire v2.7 + COMMU module (MCP2515 via SPI, 8 MHz crystal).
substitutions:
  name: hydronic-s3
  can_cs: GPIO12            # COMMU CAN CS on Fire/Basic (M5Stack COMMU examples)
  can_int: GPIO15           # COMMU CAN INT
  can_mode: LISTENONLY      # no ACK, no TX: invisible on the bus

esphome:
  name: ${name}
  friendly_name: Hydronic S3
  on_boot:
    - priority: 200
      then:
        # hydronic_s3 leaves listen-only only for its diagnostic requests.
        - lambda: |-
            id(heater).set_listen_only_hook([](bool listen_only) { return id(heater_can)->set_listen_only(listen_only); });

packages:
  board: !include boards/m5stack-fire.yaml
  ui: !include ui/heater-ui.yaml
  research: !include research.yaml   # protocol research tools; drop for production
  timers: !include timers.yaml       # heater timers (needs sntp_time); optional

external_components:
  # Relative to this config. mcp2515_irq and mipi_spi are patched forks of the
  # ESPHome core components, see their headers.
  - source:
      type: local
      path: ../components
    components: [hydronic_s3, mcp2515_irq, mipi_spi]

logger:
  # DEBUG for hydronic_s3's per-byte change log; per-tag levels may only be
  # quieter than the global one.
  level: DEBUG
  # Runtime level after boot; raise with the "Log Level" select for research runs
  # (the diag/DID lines are DEBUG).
  initial_level: INFO
  logs:
    canbus: ERROR           # DEBUG logs every frame, WARN every busy TX buffer (hydronic_s3 queues)
    i2c.idf: ERROR
    spi_device: ERROR
    display.mipi_spi: WARN
    component: WARN
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    light: WARN
    ledc.output: WARN
    lvgl: INFO

api:
  encryption:
    key: !secret api_key
  # Heater start/stop for tempcontrol / HA (REST: POST /switch/Heater%20Run/turn_on|turn_off).
  actions:
    - action: heater_start
      then:
        - switch.turn_on: heater_command
    - action: heater_stop
      then:
        - switch.turn_off: heater_command

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: group_control
      name: "Heater Control"
      sorting_weight: 5
    - id: group_heater
      name: "Heater status"
      sorting_weight: 10
    - id: group_components
      name: "Components"
      sorting_weight: 11
    - id: group_counters
      name: "Counters & identification"
      sorting_weight: 12
    - id: group_debug
      name: "Debug tools"
      sorting_weight: 30
    - id: group_can
      name: "CAN bus"
      sorting_weight: 15
    - id: group_board
      name: "M5 Fire"
      sorting_weight: 20

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

# Marked successful by mcp2515_irq at its start (15 s): the flash writes (OTA image
# confirm, boot counter) must not hit the running CAN reception.
safe_mode:
  id: boot_safe_mode

canbus:
  - platform: mcp2515_irq
    id: heater_can
    spi_id: lcd_bus
    cs_pin:
      number: ${can_cs}
      ignore_strapping_warning: true   # GPIO12 (MTDI); boots fine with COMMU attached
    interrupt_pin:
      number: ${can_int}
      ignore_strapping_warning: true   # GPIO15 (MTDO); INT idles high, as the boot default
    rx_queue_len: 256
    can_id: 0
    clock: 8MHZ
    bit_rate: 500kbps
    mode: ${can_mode}
    start_delay: 15s
    safe_mode_id: boot_safe_mode

hydronic_s3:
  id: heater
  canbus_id: heater_can
  # Optional: set the heater's clock (as the EasyStart's time setting) from this time
  # source; sent with the config burst and on each sync while we control the heater.
  time_id: sntp_time
  # Diagnosis only: tempcontrol is the control unit (runtime switch "Observer").
  observer: true

time:
  - platform: sntp  # or homeassistant
    id: sntp_time
    timezone: Europe/Berlin


# No GPIO one_wire/dallas_temp here: its bit-banging locks interrupts on the
# loop core long enough to block the MCP2515 INT ISR during frame bursts (RX
# overflow every poll, measured).

binary_sensor:
  - platform: template
    name: "Water Pump"
    icon: mdi:pump
    lambda: "return id(s_water_pump_current).state > 0.2f;"  # NAN (unknown) reads as off
    web_server:
      sorting_group_id: group_components
  - platform: hydronic_s3
    on_request:
      name: "Heater On Request"
      icon: mdi:power
      web_server:
        sorting_group_id: group_heater
    flame:
      id: b_flame
      name: "Flame"
      icon: mdi:fire
      web_server:
        sorting_group_id: group_heater
    request:
      name: "Heater Request"
      icon: mdi:power-plug-outline
      web_server:
        sorting_group_id: group_heater
    vehicle_fan:
      name: "Vehicle Fan"
      icon: mdi:fan
      web_server:
        sorting_group_id: group_heater
    connected:
      name: "Heater Connected"
      icon: mdi:lan-connect
      web_server:
        sorting_group_id: group_heater
    busy:
      name: "Heater Busy"
      icon: mdi:progress-clock
      web_server:
        sorting_group_id: group_heater
  - id: !extend button_a
    on_press:
      - lvgl.page.previous:
  - id: !extend button_c
    on_press:
      - lvgl.page.next:

# LVGL redraws only invalidated areas; mipi_spi (patched) splits each flush into
# short bus holds so the MCP2515 reader is never locked out.
lvgl:
  displays: [lcd]
  buffer_size: 12.5%

interval:
  # Labels are set only when their text changes, so LVGL invalidates nothing else.
  - interval: 1s
    then:
      - lambda: |-
          auto set = [](lv_obj_t *lbl, const char *txt) {
            if (strcmp(lv_label_get_text(lbl), txt) != 0)
              lv_label_set_text(lbl, txt);
          };
          char buf[512];
          const float t = id(heater).outlet_temperature();
          if (std::isnan(t)) snprintf(buf, sizeof(buf), "--.- °C");
          else snprintf(buf, sizeof(buf), "%.1f °C", t);
          set(id(lbl_outlet), buf);
          const int st = id(heater).state(), rq = id(heater).on_request();
          const char *name = hydronic_s3::HydronicS3::state_name(st);
          char code[8];
          snprintf(code, sizeof(code), !id(heater).connected() ? "offline" : st < 0 ? "--" : "0x%02X", st);
          const int fc = id(heater).fault_code();
          // DID values: NAN until the first poll answer.
          auto num = [](char *out, size_t len, float v, const char *fmt) {
            if (std::isnan(v)) snprintf(out, len, "--");
            else snprintf(out, len, fmt, v);
          };
          // Colours are set only on change: no needless invalidation.
          auto bg = [](lv_obj_t *obj, uint32_t &last, uint32_t c) {
            if (last != c) {
              last = c;
              lv_obj_set_style_bg_color(obj, lv_color_hex(c), 0);
            }
          };
          auto fg = [](lv_obj_t *obj, uint32_t &last, uint32_t c) {
            if (last != c) {
              last = c;
              lv_obj_set_style_text_color(obj, lv_color_hex(c), 0);
            }
          };
          static uint32_t c_phase = 0, c_flame = 0, c_flame_t = 0, c_glow = 0, c_glow_t = 0;
          static int32_t last_bar = -1;
          char v1[16], v2[16];
          const float ti = id(s_inlet).state;
          num(v1, sizeof(v1), ti, "%.1f °C");
          set(id(lbl_inlet), std::isnan(ti) ? "--.- °C" : v1);
          num(v1, sizeof(v1), t - ti, "%.1f");
          snprintf(buf, sizeof(buf), "ΔT %s K", v1);
          set(id(lbl_dt), buf);

          const float pw = id(s_power).state;
          num(v1, sizeof(v1), pw, "%.0f");
          num(v2, sizeof(v2), id(s_fuel).state, "%.2f");
          snprintf(buf, sizeof(buf), "%s W  ·  %s l/h", v1, v2);
          set(id(lbl_power), buf);
          const int32_t bar = std::isnan(pw) ? 0 : (int32_t) pw;
          if (bar != last_bar) {
            last_bar = bar;
            lv_bar_set_value(id(bar_power), bar, LV_ANIM_OFF);
          }

          const float ph = id(s_phase).state;
          const int phc = std::isnan(ph) ? -1 : (int) ph;
          const char *phase = phc < 0 ? nullptr : hydronic_s3::HydronicS3::phase_name(phc);
          if (phase == nullptr) snprintf(v1, sizeof(v1), phc < 0 ? "--" : "0x%02X", phc);
          set(id(lbl_phase), phase != nullptr ? phase : v1);
          bg(id(chip_phase), c_phase,
             (phc == 0x0A || phc == 0x0C || phc == 0x0F) ? 0xA08000 : phc == 0x14 ? 0xC05000 : (phc == 0x1E || phc == 0x1F) ? 0x6A3C9A
             : phc == 0x28 ? 0x245C9A : phc == 0xC8 ? 0x9A2020 : phc == 0xDC ? 0x8A7A10 : phc == 0xD2 ? 0x1E5A9A : 0x303030);

          const bool flame = id(b_flame).has_state() && id(b_flame).state;
          set(id(lbl_flame), flame ? "FLAME" : "no flame");
          bg(id(chip_flame), c_flame, flame ? 0xC02818 : 0x303030);
          fg(id(lbl_flame), c_flame_t, flame ? 0xFFFFFF : 0x909090);

          const float gl = id(s_glow).state;
          const bool glow = !std::isnan(gl) && gl > 0;
          if (glow) snprintf(v1, sizeof(v1), "GLOW %.0f W", gl);
          set(id(lbl_glow), glow ? v1 : "glow off");
          bg(id(chip_glow), c_glow, glow ? 0xB08800 : 0x303030);
          fg(id(lbl_glow), c_glow_t, glow ? 0xFFFFFF : 0x909090);

          num(v1, sizeof(v1), id(s_blower).state, "%.0f");
          snprintf(buf, sizeof(buf), "Blower %s rpm", v1);
          set(id(lbl_blower), buf);
          num(v1, sizeof(v1), id(s_voltage).state, "%.1f");
          snprintf(buf, sizeof(buf), "%s V", v1);
          set(id(lbl_voltage), buf);

          // Stored fault codes (read on a flags rise or the button) in red: first code, +N more.
          static uint32_t c_heater = 0;
          const std::string &codes = id(heater).fault_codes();
          const bool stored = !codes.empty() && codes != "none";
          std::string first = codes.substr(0, codes.find(','));
          const size_t more = std::count(codes.begin(), codes.end(), ',');
          if (stored && more > 0) first += " +" + std::to_string(more);
          snprintf(buf, sizeof(buf), "%s  ·  req %s  ·  %s", name != nullptr ? name : code,
                   rq < 0 ? "--" : rq == 1 ? "on" : "off",
                   stored ? first.c_str() : fc < 0 ? "fault --" : fc == 0 ? "fault none" : "fault set");
          set(id(lbl_heater), buf);
          fg(id(lbl_heater), c_heater, stored ? 0xFF4040 : 0xA0A0A0);

          snprintf(buf, sizeof(buf), "Bat %.0f%%%s   %s",
                   id(battery_level).state,
                   id(battery_full).state ? " full" : id(battery_charging).state ? " chg" : "",
                   id(wifi_ip).state.empty() ? "no wifi" : id(wifi_ip).state.c_str());
          set(id(lbl_refs), buf);

          // Header: live CAN rate, green while frames arrive.
          static uint32_t last_frames = 0;
          const uint32_t frames = id(heater).frames(), fps = frames - last_frames;
          last_frames = frames;
          snprintf(buf, sizeof(buf), "CAN %u fps", (unsigned) fps);
          set(id(lbl_can), buf);
          lv_obj_set_style_text_color(id(lbl_can), lv_color_hex(fps ? 0x40FF40 : 0xFF4040), 0);

          auto *can = id(heater_can);
          snprintf(buf, sizeof(buf), "%u fr  %u IDs  ovf %u  drop %u  q %u",
                   (unsigned) id(heater).frames(), (unsigned) id(heater).ids().size(),
                   (unsigned) can->rx_overflows(), (unsigned) can->queue_drops(),
                   (unsigned) can->queue_high_water());
          set(id(lbl_bus), buf);

          const uint32_t now = millis();
          int n = 0, rows = 0;
          for (auto &kv : id(heater).ids()) {
            if (rows++ == 12 || n > (int) sizeof(buf) - 48) break;
            const auto &e = kv.second;
            char hex[17];
            for (int b = 0; b < e.len; b++) snprintf(hex + 2 * b, 3, "%02X", e.data[b]);
            hex[2 * e.len] = 0;
            n += snprintf(buf + n, sizeof(buf) - n, e.ext ? "%08X %-16s %5.0f%s\n" : "     %03X %-16s %5.0f%s\n",
                          (unsigned) (kv.first & 0x1FFFFFFF), hex, e.period_ms,
                          now - e.last_ms >= 2000 ? " -" : "");
          }
          buf[n] = 0;
          set(id(lbl_ids), n ? buf : "No frames yet");

  # Reader health: driver vs processed counts, INT level, controller flags.
  - interval: 10s
    then:
      - lambda: |-
          uint8_t intf, eflg, rec, tec;
          bool int_low;
          auto *can = id(heater_can);
          can->read_diag(intf, eflg, rec, tec, int_low);
          id(s_can_rec).publish_state(rec);
          id(s_can_tec).publish_state(tec);
          id(s_can_eflg).publish_state(eflg);
          can->log_overflow_trace();
          uint32_t wake_us, drain_us, frame_us;
          can->take_latency_max(wake_us, drain_us, frame_us);
          ESP_LOGD("can_diag", "read %u processed %u ovf %u drop %u qmax %u | wake max %u us frame max %u us drain max %u us | INT %s CANINTF %02X EFLG %02X REC %u TEC %u",
                   (unsigned) can->frames_read(), (unsigned) id(heater).frames(), (unsigned) can->rx_overflows(),
                   (unsigned) can->queue_drops(), (unsigned) can->queue_high_water(), (unsigned) wake_us,
                   (unsigned) frame_us, (unsigned) drain_us, int_low ? "LOW" : "high", intf, eflg, rec, tec);

sensor:
  # MCP2515 error counters (CAN error confinement) and EFLG, from the 10 s diag.
  - platform: template
    id: s_can_rec
    name: "CAN RX Error Counter"
    icon: mdi:alert-outline
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: group_can
  - platform: template
    id: s_can_tec
    name: "CAN TX Error Counter"
    icon: mdi:alert-outline
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: group_can
  - platform: template
    id: s_can_eflg
    name: "CAN Error Flags"
    icon: mdi:flag-outline
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: group_can
  - platform: hydronic_s3
    outlet_temperature:
      name: "Outlet Temperature"
      icon: mdi:thermometer-chevron-up
      filters:
        # The raw value toggles by 0.1 degC several times a second.
        - or:
            - delta: 0.2
            - throttle: 30s
      web_server:
        sorting_group_id: group_heater
    state_code:
      name: "Heater State Code"
      icon: mdi:numeric
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_components
    inlet_temperature:
      id: s_inlet
      name: "Inlet Temperature"
      icon: mdi:thermometer-chevron-down
      web_server:
        sorting_group_id: group_heater
    flame_sensor_temperature:
      name: "Flame Sensor Temperature"
      icon: mdi:thermometer-high
      web_server:
        sorting_group_id: group_components
    supply_voltage:
      id: s_voltage
      name: "Supply Voltage"
      icon: mdi:car-battery
      web_server:
        sorting_group_id: group_heater
    blower_speed:
      id: s_blower
      name: "Blower Speed"
      icon: mdi:fan
      web_server:
        sorting_group_id: group_components
    glow_plug_power:
      id: s_glow
      name: "Glow Plug Power"
      icon: mdi:lightning-bolt
      web_server:
        sorting_group_id: group_components
    water_pump_current:
      id: s_water_pump_current
      name: "Water Pump Current"
      icon: mdi:pump
      web_server:
        sorting_group_id: group_components
    water_pump_power:
      name: "Water Pump Power"
      icon: mdi:pump
      web_server:
        sorting_group_id: group_components
    fuel_pump_current:
      name: "Fuel Pump Current"
      icon: mdi:current-dc
      web_server:
        sorting_group_id: group_components
    metering_pump_rate:
      name: "Metering Pump Rate"
      icon: mdi:pump
      web_server:
        sorting_group_id: group_components
    operating_phase:
      id: s_phase
      name: "Operating Phase"
      icon: mdi:progress-clock
      web_server:
        sorting_group_id: group_heater
    fuel_consumption:
      id: s_fuel
      name: "Fuel Consumption"
      icon: mdi:gas-station
      web_server:
        sorting_group_id: group_heater
    heating_power:
      id: s_power
      name: "Heating Power (estimated)"
      icon: mdi:radiator
      web_server:
        sorting_group_id: group_heater
    fuel_total:
      name: "Fuel Total"
      icon: mdi:gas-station-outline
      web_server:
        sorting_group_id: group_counters
    hours_total:
      name: "Operating Hours"
      icon: mdi:timer-outline
      web_server:
        sorting_group_id: group_counters
    hours_power_0_25:
      name: "Hours Power 0-25%"
      icon: mdi:timer-outline
      web_server:
        sorting_group_id: group_counters
    hours_power_25_50:
      name: "Hours Power 25-50%"
      icon: mdi:timer-outline
      web_server:
        sorting_group_id: group_counters
    hours_power_50_75:
      name: "Hours Power 50-75%"
      icon: mdi:timer-outline
      web_server:
        sorting_group_id: group_counters
    hours_power_75_100:
      name: "Hours Power 75-100%"
      icon: mdi:timer-outline
      web_server:
        sorting_group_id: group_counters
    hours_pause:
      name: "Hours Control Pause"
      icon: mdi:timer-pause-outline
      web_server:
        sorting_group_id: group_counters
    hours_altitude:
      name: "Hours Altitude Mode"
      icon: mdi:image-filter-hdr
      web_server:
        sorting_group_id: group_counters
    start_step:
      name: "Start Step"
      icon: mdi:stairs-up
      web_server:
        sorting_group_id: group_components
    combustion_state:
      name: "Combustion State"
      icon: mdi:fire-circle
      web_server:
        sorting_group_id: group_components
    water_flow:
      name: "Water Flow (estimated)"
      icon: mdi:water-pump
      web_server:
        sorting_group_id: group_heater
    control_unit_temperature:
      name: "Control Unit Temperature"
      icon: mdi:chip
      web_server:
        sorting_group_id: group_components
  - platform: template
    name: "CAN Frame Rate"
    icon: mdi:speedometer
    unit_of_measurement: "fps"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      static uint32_t last_frames = 0, last_ms = 0;
      const uint32_t now = millis(), frames = id(heater).frames();
      const float fps = last_ms ? (frames - last_frames) * 1000.0f / (now - last_ms) : NAN;
      last_frames = frames;
      last_ms = now;
      return fps;
    web_server:
      sorting_group_id: group_can
  - platform: template
    name: "CAN RX Overflows"
    icon: mdi:tray-alert
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return id(heater_can)->rx_overflows();"
    web_server:
      sorting_group_id: group_can
  - platform: template
    name: "CAN Queue Drops"
    icon: mdi:tray-remove
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return id(heater_can)->queue_drops();"
    web_server:
      sorting_group_id: group_can
  - platform: template
    name: "CAN Queue High Water"
    icon: mdi:tray-full
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return id(heater_can)->queue_high_water();"
    web_server:
      sorting_group_id: group_can

switch:
  # Polls the DIDs behind the DID sensors every 5 s (UDS requests: normal mode).
  - platform: hydronic_s3
    type: polling
    id: poll_dids
    name: "Poll DIDs"
    web_server:
      sorting_group_id: group_debug
  # Heater start/stop in place of the EasyStart (which must be off the bus): sends its
  # command set (054-057, 60D) while on; off sends "off" until the heater is idle (run-down).
  # Reads back off when the component backs off (EasyStart frames seen). Off after boot.
  - platform: hydronic_s3
    type: run
    id: heater_command
    name: "Heater Run"
    web_server:
      sorting_group_id: group_control
  # Observer: diagnosis only, another control unit (tempcontrol) owns the heater; Heater Run refused.
  - platform: template
    name: "Observer"
    icon: mdi:eye
    lambda: "return id(heater).observer();"
    restore_mode: DISABLED  # no action at boot: the config's observer: stays
    entity_category: config
    web_server:
      sorting_group_id: group_control
    turn_on_action:
      - lambda: "id(heater).set_observer(true);"
    turn_off_action:
      - lambda: "id(heater).set_observer(false);"

select:
  # What "Heater Run" starts, as the EasyStart's modes: Heat (burner), Residual heat
  # (water pump + vehicle fan, e.g. to spread an electrically heated reservoir), Fan (vehicle fan only).
  # "S+" is display only: shown while S+ runs the heater, no change accepted then.
  - platform: hydronic_s3
    mode:
      id: heater_mode
      name: "Heater Mode"
      web_server:
        sorting_group_id: group_control
  - platform: logger
    name: "Log Level"
    web_server:
      sorting_group_id: group_debug

number:
  # "Heater Run" watchdog: 0 = run until turned off (default); > 0: turn_on must be
  # repeated within this many minutes, else the heater is stopped.
  - platform: hydronic_s3
    run_watchdog:
      name: "Heater Run Watchdog"
      web_server:
        sorting_group_id: group_control
button:
  - platform: hydronic_s3
    clear_fault_codes:
      name: "Clear Fault Codes"
      web_server:
        sorting_group_id: group_control
    # Error-memory readout like the EasyStart's (mode handled by the component).
    read_fault_codes:
      name: "Read Fault Codes"
      web_server:
        sorting_group_id: group_control

text_sensor:
  - platform: hydronic_s3
    hardware_version:
      name: "Heater Hardware Version"
      icon: mdi:chip
      web_server:
        sorting_group_id: group_counters
