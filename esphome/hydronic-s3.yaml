# Eberspächer Hydronic S3 on CAN: hydronic_s3 component, heater data on the
# display and as HA sensors. Listen-only until the protocol is decoded; the
# component logs new IDs, changing bytes and a periodic ID table.
# Hardware: M5Stack Fire v2.7 + COMMU module (MCP2515 via SPI, 8 MHz crystal).
substitutions:
  name: hydronic-s3
  can_cs: GPIO12            # COMMU CAN CS on Fire/Basic (M5Stack COMMU examples)
  can_int: GPIO15           # COMMU CAN INT
  can_mode: LISTENONLY      # no ACK, no TX: invisible on the bus

esphome:
  name: ${name}
  friendly_name: Hydronic S3
  on_boot:
    - priority: 200
      then:
        # hydronic_s3 leaves listen-only only for its diagnostic requests.
        - lambda: |-
            id(heater).set_listen_only_hook([](bool listen_only) { return id(heater_can)->set_listen_only(listen_only); });
        - switch.turn_on: poll_dids

packages:
  board: !include boards/m5stack-fire.yaml

external_components:
  # Relative to this config. mcp2515_irq and mipi_spi are patched forks of the
  # ESPHome core components, see their headers.
  - source:
      type: local
      path: ../components
    components: [hydronic_s3, mcp2515_irq, mipi_spi]

logger:
  # DEBUG for hydronic_s3's per-byte change log; per-tag levels may only be
  # quieter than the global one.
  level: DEBUG
  logs:
    canbus: INFO            # logs every frame at DEBUG
    i2c.idf: ERROR
    spi_device: ERROR
    display.mipi_spi: WARN
    component: WARN
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    light: WARN
    ledc.output: WARN
    lvgl: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: group_heater
      name: "Heater"
      sorting_weight: 10
    - id: group_components
      name: "Components"
      sorting_weight: 11
    - id: group_counters
      name: "Counters & identification"
      sorting_weight: 12
    - id: group_debug
      name: "Debug tools"
      sorting_weight: 30
    - id: group_can
      name: "CAN bus"
      sorting_weight: 15
    - id: group_board
      name: "M5 Fire"
      sorting_weight: 20

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

# Marked successful by mcp2515_irq at its start (15 s): the flash writes (OTA image
# confirm, boot counter) must not hit the running CAN reception.
safe_mode:
  id: boot_safe_mode

canbus:
  - platform: mcp2515_irq
    id: heater_can
    spi_id: lcd_bus
    cs_pin:
      number: ${can_cs}
      ignore_strapping_warning: true   # GPIO12 (MTDI); boots fine with COMMU attached
    interrupt_pin:
      number: ${can_int}
      ignore_strapping_warning: true   # GPIO15 (MTDO); INT idles high, as the boot default
    rx_queue_len: 256
    can_id: 0
    clock: 8MHZ
    bit_rate: 500kbps
    mode: ${can_mode}
    start_delay: 15s
    safe_mode_id: boot_safe_mode

hydronic_s3:
  id: heater
  canbus_id: heater_can


# No GPIO one_wire/dallas_temp here: its bit-banging locks interrupts on the
# loop core long enough to block the MCP2515 INT ISR during frame bursts (RX
# overflow every poll, measured).

binary_sensor:
  - platform: hydronic_s3
    on_request:
      name: "Heater On Request"
      web_server:
        sorting_group_id: group_heater
    flame:
      id: b_flame
      name: "Flame"
      web_server:
        sorting_group_id: group_heater
  - id: !extend button_a
    on_press:
      - lvgl.page.previous:
  - id: !extend button_c
    on_press:
      - lvgl.page.next:

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 22
  - file: "gfonts://Roboto"
    id: font_body
    size: 18
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["°", "Δ"]
  - file: "gfonts://Roboto"
    id: font_big
    size: 48
    glyphs: "0123456789.-°C "
  - file: "gfonts://Roboto Mono"
    id: font_mono
    size: 14

# LVGL redraws only invalidated areas; mipi_spi (patched) splits each flush into
# short bus holds so the MCP2515 reader is never locked out.
lvgl:
  displays: [lcd]
  buffer_size: 12.5%
  style_definitions:
    - id: style_dim
      text_color: 0xA0A0A0
      text_font: font_body
  theme:
    label:
      text_color: 0xFFFFFF
      text_font: font_body
  pages:
    - id: page_heater
      bg_color: 0x000000
      widgets:
        - obj:
            x: 0
            y: 0
            width: 320
            height: 30
            bg_color: 0x421A00
            border_width: 0
            radius: 0
            widgets:
              - label:
                  align: LEFT_MID
                  text: "Hydronic S3"
                  text_font: font_title
                  text_color: 0xFF9030
              - label:
                  id: lbl_can
                  align: RIGHT_MID
                  text: "CAN --"
                  text_color: 0xFF4040
        - label:
            id: lbl_outlet
            x: 10
            y: 40
            text_font: font_big
            text: "--.- °C"
        - label:
            id: lbl_heater
            x: 10
            y: 100
            text: ""
        - label:
            id: lbl_refs
            x: 10
            y: 216
            styles: style_dim
            text: ""
    - id: page_bus
      bg_color: 0x000000
      widgets:
        - label:
            id: lbl_bus
            x: 6
            y: 4
            text: ""
        - label:
            id: lbl_ids
            x: 2
            y: 30
            text_font: font_mono
            text: ""

interval:
  # Labels are set only when their text changes, so LVGL invalidates nothing else.
  - interval: 1s
    then:
      - lambda: |-
          auto set = [](lv_obj_t *lbl, const char *txt) {
            if (strcmp(lv_label_get_text(lbl), txt) != 0)
              lv_label_set_text(lbl, txt);
          };
          char buf[512];
          const float t = id(heater).outlet_temperature();
          if (std::isnan(t)) snprintf(buf, sizeof(buf), "--.- °C");
          else snprintf(buf, sizeof(buf), "%.1f °C", t);
          set(id(lbl_outlet), buf);
          const int st = id(heater).state(), rq = id(heater).on_request();
          const char *name = hydronic_s3::HydronicS3::state_name(st);
          char code[8];
          snprintf(code, sizeof(code), st < 0 ? "--" : "0x%02X", st);
          const int fc = id(heater).fault_code();
          // DID values: NAN until the first poll answer.
          auto num = [](char *out, size_t len, float v, const char *fmt) {
            if (std::isnan(v)) snprintf(out, len, "--");
            else snprintf(out, len, fmt, v);
          };
          char inl[12], dt[12], pw[12], fu[12], gl[12], bl[12], v[12];
          const float ti = id(s_inlet).state;
          num(inl, sizeof(inl), ti, "%.1f");
          num(dt, sizeof(dt), t - ti, "%.1f");
          num(pw, sizeof(pw), id(s_power).state, "%.0f");
          num(fu, sizeof(fu), id(s_fuel).state, "%.2f");
          num(gl, sizeof(gl), id(s_glow).state, "%.0f");
          num(bl, sizeof(bl), id(s_blower).state, "%.0f");
          num(v, sizeof(v), id(s_voltage).state, "%.1f");
          const float ph = id(s_phase).state;
          const char *phase = std::isnan(ph) ? nullptr : hydronic_s3::HydronicS3::phase_name((int) ph);
          char phase_code[8];
          snprintf(phase_code, sizeof(phase_code), std::isnan(ph) ? "--" : "0x%02X", std::isnan(ph) ? 0 : (int) ph);
          snprintf(buf, sizeof(buf),
                   "Inlet  %s °C   ΔT %s K\n%s  %s W  %s l/h\nFlame %s   Glow %s W\nBlower %s rpm   %s V\n"
                   "State %s  Req %s  Fault %s",
                   inl, dt, phase != nullptr ? phase : phase_code, pw, fu,
                   !id(b_flame).has_state() ? "--" : id(b_flame).state ? "on" : "off", gl, bl, v,
                   name != nullptr ? name : code, rq < 0 ? "--" : rq == 1 ? "on" : "off",
                   fc < 0 ? "--" : fc == 0 ? "none" : "set");
          set(id(lbl_heater), buf);

          snprintf(buf, sizeof(buf), "Bat %.0f%%%s   %s",
                   id(battery_level).state,
                   id(battery_full).state ? " full" : id(battery_charging).state ? " chg" : "",
                   id(wifi_ip).state.empty() ? "no wifi" : id(wifi_ip).state.c_str());
          set(id(lbl_refs), buf);

          // Header: live CAN rate, green while frames arrive.
          static uint32_t last_frames = 0;
          const uint32_t frames = id(heater).frames(), fps = frames - last_frames;
          last_frames = frames;
          snprintf(buf, sizeof(buf), "CAN %u fps", (unsigned) fps);
          set(id(lbl_can), buf);
          lv_obj_set_style_text_color(id(lbl_can), lv_color_hex(fps ? 0x40FF40 : 0xFF4040), 0);

          auto *can = id(heater_can);
          snprintf(buf, sizeof(buf), "%u fr  %u IDs  ovf %u  drop %u  q %u",
                   (unsigned) id(heater).frames(), (unsigned) id(heater).ids().size(),
                   (unsigned) can->rx_overflows(), (unsigned) can->queue_drops(),
                   (unsigned) can->queue_high_water());
          set(id(lbl_bus), buf);

          const uint32_t now = millis();
          int n = 0, rows = 0;
          for (auto &kv : id(heater).ids()) {
            if (rows++ == 12 || n > (int) sizeof(buf) - 48) break;
            const auto &e = kv.second;
            char hex[17];
            for (int b = 0; b < e.len; b++) snprintf(hex + 2 * b, 3, "%02X", e.data[b]);
            hex[2 * e.len] = 0;
            n += snprintf(buf + n, sizeof(buf) - n, e.ext ? "%08X %-16s %5.0f%s\n" : "     %03X %-16s %5.0f%s\n",
                          (unsigned) (kv.first & 0x1FFFFFFF), hex, e.period_ms,
                          now - e.last_ms >= 2000 ? " -" : "");
          }
          buf[n] = 0;
          set(id(lbl_ids), n ? buf : "No frames yet");

  # Reader health: driver vs processed counts, INT level, controller flags.
  - interval: 10s
    then:
      - lambda: |-
          uint8_t intf, eflg, rec;
          bool int_low;
          auto *can = id(heater_can);
          can->read_diag(intf, eflg, rec, int_low);
          can->log_overflow_trace();
          uint32_t wake_us, drain_us, frame_us;
          can->take_latency_max(wake_us, drain_us, frame_us);
          ESP_LOGI("can_diag", "read %u processed %u ovf %u drop %u qmax %u | wake max %u us frame max %u us drain max %u us | INT %s CANINTF %02X EFLG %02X REC %u",
                   (unsigned) can->frames_read(), (unsigned) id(heater).frames(), (unsigned) can->rx_overflows(),
                   (unsigned) can->queue_drops(), (unsigned) can->queue_high_water(), (unsigned) wake_us,
                   (unsigned) frame_us, (unsigned) drain_us, int_low ? "LOW" : "high", intf, eflg, rec);

sensor:
  - platform: hydronic_s3
    outlet_temperature:
      name: "Outlet Temperature"
      filters:
        # The raw value toggles by 0.1 degC several times a second.
        - or:
            - delta: 0.2
            - throttle: 30s
      web_server:
        sorting_group_id: group_heater
    controller_temperature:
      name: "EasyStart Temperature"
      web_server:
        sorting_group_id: group_components
    state_code:
      name: "Heater State Code"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_components
    inlet_temperature:
      id: s_inlet
      name: "Inlet Temperature"
      web_server:
        sorting_group_id: group_heater
    flame_sensor_temperature:
      name: "Flame Sensor Temperature"
      web_server:
        sorting_group_id: group_components
    supply_voltage:
      id: s_voltage
      name: "Supply Voltage"
      web_server:
        sorting_group_id: group_heater
    blower_speed:
      id: s_blower
      name: "Blower Speed"
      web_server:
        sorting_group_id: group_components
    glow_plug_power:
      id: s_glow
      name: "Glow Plug Power"
      web_server:
        sorting_group_id: group_components
    glow_plug_raw:
      name: "Glow Plug Raw"
      web_server:
        sorting_group_id: group_components
    metering_pump_rate:
      name: "Metering Pump Rate"
      web_server:
        sorting_group_id: group_components
    operating_phase:
      id: s_phase
      name: "Operating Phase"
      web_server:
        sorting_group_id: group_heater
    fuel_consumption:
      id: s_fuel
      name: "Fuel Consumption"
      web_server:
        sorting_group_id: group_heater
    heating_power:
      id: s_power
      name: "Heating Power"
      web_server:
        sorting_group_id: group_heater
    fuel_total:
      name: "Fuel Total"
      web_server:
        sorting_group_id: group_counters
    hours_total:
      name: "Operating Hours"
      web_server:
        sorting_group_id: group_counters
    hours_power_0_25:
      name: "Hours Power 0-25%"
      web_server:
        sorting_group_id: group_counters
    hours_power_25_50:
      name: "Hours Power 25-50%"
      web_server:
        sorting_group_id: group_counters
    hours_power_50_75:
      name: "Hours Power 50-75%"
      web_server:
        sorting_group_id: group_counters
    hours_power_75_100:
      name: "Hours Power 75-100%"
      web_server:
        sorting_group_id: group_counters
    hours_pause:
      name: "Hours Control Pause"
      web_server:
        sorting_group_id: group_counters
    hours_altitude:
      name: "Hours Altitude Mode"
      web_server:
        sorting_group_id: group_counters
    fd08_raw:
      name: "FD08 Raw"
      web_server:
        sorting_group_id: group_debug
    fd35_raw:
      name: "FD35 Raw"
      web_server:
        sorting_group_id: group_debug
  - platform: template
    name: "CAN Frame Rate"
    unit_of_measurement: "fps"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      static uint32_t last_frames = 0, last_ms = 0;
      const uint32_t now = millis(), frames = id(heater).frames();
      const float fps = last_ms ? (frames - last_frames) * 1000.0f / (now - last_ms) : NAN;
      last_frames = frames;
      last_ms = now;
      return fps;
    web_server:
      sorting_group_id: group_can
  - platform: template
    name: "CAN RX Overflows"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return id(heater_can)->rx_overflows();"
    web_server:
      sorting_group_id: group_can
  - platform: template
    name: "CAN Queue Drops"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return id(heater_can)->queue_drops();"
    web_server:
      sorting_group_id: group_can
  - platform: template
    name: "CAN Queue High Water"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return id(heater_can)->queue_high_water();"
    web_server:
      sorting_group_id: group_can

switch:
  # Polls the DIDs behind the DID sensors every 5 s (UDS requests: normal mode).
  - platform: template
    id: poll_dids
    name: "Poll DIDs"
    optimistic: true
    restore_mode: ALWAYS_OFF  # turned on in on_boot, after the listen-only hook
    web_server:
      sorting_group_id: group_debug
    turn_on_action:
      - lambda: |-
          id(heater).start_polling(esphome::hydronic_s3::HydronicS3::sensor_dids(), 5000);
    turn_off_action:
      - lambda: "id(heater).stop_polling();"
  # Research: sweeps all answering DIDs FD00..FD44 instead (DID sensors keep updating).
  - platform: template
    id: poll_all_dids
    name: "Poll All DIDs"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: group_debug
    turn_on_action:
      - switch.turn_off: poll_dids
      - lambda: |-
          std::vector<uint16_t> dids;
          for (uint16_t d = 0xFD00; d <= 0xFD44; d++) dids.push_back(d);
          id(heater).start_polling(dids, 5000);
    turn_off_action:
      - lambda: "id(heater).stop_polling();"
      - switch.turn_on: poll_dids

text:
  - platform: template
    id: uds_request
    name: "UDS Request"
    entity_category: config
    mode: text
    optimistic: true
    initial_value: "19 02 08"
    web_server:
      sorting_group_id: group_debug

number:
  # DID scan range (decimal in the UI, 0..65535).
  - platform: template
    id: did_from
    name: "DID Scan From"
    entity_category: config
    min_value: 0
    max_value: 65535
    step: 1
    mode: box
    optimistic: true
    initial_value: 0
    web_server:
      sorting_group_id: group_debug
  - platform: template
    id: did_to
    name: "DID Scan To"
    entity_category: config
    min_value: 0
    max_value: 65535
    step: 1
    mode: box
    optimistic: true
    initial_value: 4095
    web_server:
      sorting_group_id: group_debug

button:
  - platform: template
    name: "Send UDS Request"
    web_server:
      sorting_group_id: group_debug
    on_press:
      - lambda: "id(heater).send_uds_request(id(uds_request).state);"
  - platform: template
    name: "Scan Local IDs"
    web_server:
      sorting_group_id: group_debug
    on_press:
      - lambda: "id(heater).scan_local_ids(0x00, 0xFF);"
  - platform: template
    name: "Scan DID Range"
    web_server:
      sorting_group_id: group_debug
    on_press:
      - lambda: "id(heater).scan_dids((uint16_t) id(did_from).state, (uint16_t) id(did_to).state);"
  # UDS identification DIDs (read-only); results in "Diag Response".
  - platform: template
    name: "Scan Identification DIDs"
    web_server:
      sorting_group_id: group_debug
    on_press:
      - lambda: "id(heater).scan_dids(0xF180, 0xF19F);"
  # Error-memory readout like the EasyStart's: the only time this node transmits.
  # Normal mode just for the request and response, then back to listen-only.
  - platform: template
    name: "Read Fault Codes"
    web_server:
      sorting_group_id: group_heater
    on_press:
      - lambda: |-
          if (id(heater_can)->set_listen_only(false))
            id(heater).request_fault_codes(0x08);
      - delay: 3s
      - lambda: "id(heater_can)->set_listen_only(true);"

text_sensor:
  - platform: hydronic_s3
    hardware_version:
      name: "Heater Hardware Version"
      web_server:
        sorting_group_id: group_counters
    software_version:
      name: "Heater Software Version"
      web_server:
        sorting_group_id: group_counters
    part_number:
      name: "Heater Part Number"
      web_server:
        sorting_group_id: group_counters
    serial_number:
      name: "Heater Serial Number"
      web_server:
        sorting_group_id: group_counters
    state:
      name: "Heater State"
      web_server:
        sorting_group_id: group_heater
    fault:
      name: "Heater Fault"
      web_server:
        sorting_group_id: group_heater
    fault_codes:
      name: "Heater Fault Codes"
      web_server:
        sorting_group_id: group_heater
    diag_response:
      name: "Diag Response"
      web_server:
        sorting_group_id: group_debug
    event:
      name: "Heater Event"
      web_server:
        sorting_group_id: group_debug
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      web_server:
        sorting_group_id: group_board
